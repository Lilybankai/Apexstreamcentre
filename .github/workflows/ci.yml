name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web workspace (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first: it emits each package's dist/*.d.ts in topological order, so
      # cross-package imports (e.g. @apex/shared) resolve during typecheck.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm -r typecheck

  rust-fmt:
    name: Desktop core (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + rustfmt
        run: rustup component add rustfmt

      - name: Check formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all --check
